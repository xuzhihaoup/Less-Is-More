[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "less-is-more-segmentation"
version = "0.1.0"
description = "Training code for the Less-Is-More medical image segmentation experiments."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.4,<3",
    "numpy==1.26.4",
    "Pillow==10.4.0",
    "nibabel>=5.2,<6",
    "tensorboard>=2.17,<3",
    "timm>=1.0,<2",
    "einops>=0.8,<1",
    "scikit-image>=0.24,<0.25",
]

[project.scripts]
less-is-more-train = "less_is_more.cli:main"
less-is-more-search = "less_is_more.search:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py39"
